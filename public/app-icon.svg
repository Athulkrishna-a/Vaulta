<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0DFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)"/>

  <!-- Vault Shield Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Outer Ring -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="url(#vaultGrad)" stroke-width="20"/>
    
    <!-- Vault Dial & Coin Symbol -->
    <circle cx="150" cy="150" r="70" fill="url(#vaultGrad)"/>
    
    <!-- Golden Coin V Symbol -->
    <path d="M 125 125 L 150 175 L 175 125" fill="none" stroke="#6C5CE7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
